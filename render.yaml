services:
  - type: web
    name: comfy-keys-vault
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Set the values below in the Render dashboard (Environment tab).
      - key: EXTERNAL_SUPABASE_URL
        sync: false
      - key: EXTERNAL_SUPABASE_ANON_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SITE_ADMIN_PASSWORD
        sync: false
